<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAP 文献推荐 — Maximum Academic Press</title>
<style>
:root {
  --primary: #1a5276;
  --primary-light: #2980b9;
  --accent: #e67e22;
  --bg: #f4f6f9;
  --card: #ffffff;
  --text: #1c2b3a;
  --text-light: #6b7a8d;
  --border: #dde3ea;
  --shadow: 0 2px 16px rgba(26,82,118,0.08);
  --radius: 14px;
  --green: #1a8a4a;
  --green-bg: #eafaf1;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ── Header ── */
.header {
  background: linear-gradient(135deg, #0f2a3a 0%, #1a5276 60%, #1a3a4a 100%);
  color: #fff;
  padding: 36px 24px 30px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.header::before {
  content: '';
  position: absolute;
  top: -60px; right: -60px;
  width: 220px; height: 220px;
  background: rgba(255,255,255,0.04);
  border-radius: 50%;
}
.header::after {
  content: '';
  position: absolute;
  bottom: -40px; left: -40px;
  width: 160px; height: 160px;
  background: rgba(255,255,255,0.03);
  border-radius: 50%;
}
.header-logo {
  max-width: 180px;
  height: auto;
  margin-bottom: 16px;
  filter: brightness(0) invert(1);
  opacity: 0.92;
}
.header h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.3px; }
.header p { font-size: 14px; opacity: 0.78; max-width: 560px; margin: 0 auto; line-height: 1.6; }

/* ── Config Banner (API key setup) ── */
.config-banner {
  background: #fff8ec;
  border-bottom: 2px solid #f39c12;
  padding: 12px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 13px;
  color: #7d5a00;
}
.config-banner.hidden { display: none; }
.config-banner strong { color: #b7650c; }
.config-btn {
  margin-left: auto;
  padding: 6px 16px;
  background: #e67e22;
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
}
.config-btn:hover { background: #cf6d17; }

/* ── Config Modal ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.hidden { display: none; }
.modal {
  background: #fff;
  border-radius: 16px;
  padding: 32px;
  max-width: 520px;
  width: 100%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.25);
}
.modal h2 { font-size: 20px; margin-bottom: 8px; color: var(--primary); }
.modal p { font-size: 13px; color: var(--text-light); line-height: 1.7; margin-bottom: 20px; }
.modal label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.modal input {
  width: 100%;
  padding: 10px 14px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  margin-bottom: 16px;
  font-family: monospace;
}
.modal input:focus { outline: none; border-color: var(--primary-light); }
.modal-btns { display: flex; gap: 10px; justify-content: flex-end; }
.btn-save {
  padding: 10px 24px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
.btn-save:hover { background: var(--primary-light); }
.btn-cancel {
  padding: 10px 20px;
  background: #f5f5f5;
  color: #555;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  cursor: pointer;
}
.modal .step-list { margin: 12px 0 20px; padding-left: 18px; }
.modal .step-list li { font-size: 13px; color: #444; line-height: 1.8; }
.modal .step-list a { color: var(--primary-light); }

/* ── Main ── */
.main {
  max-width: 900px;
  margin: 0 auto;
  padding: 28px 20px 60px;
}

/* ── Mode Tabs ── */
.mode-tabs {
  display: flex;
  gap: 0;
  margin-bottom: 24px;
  background: #fff;
  border-radius: 12px;
  padding: 5px;
  box-shadow: var(--shadow);
}
.mode-tab {
  flex: 1;
  padding: 11px 16px;
  border: none;
  background: transparent;
  border-radius: 9px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-light);
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.mode-tab.active {
  background: var(--primary);
  color: #fff;
  box-shadow: 0 2px 10px rgba(26,82,118,0.22);
}
.mode-tab:hover:not(.active) { background: #f0f4f8; color: var(--primary); }

/* ── Panel ── */
.panel { display: none; }
.panel.active { display: block; }

/* ── Card ── */
.card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 28px;
  margin-bottom: 20px;
}
.card-label {
  font-size: 15px;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-label .icon { font-size: 18px; }

/* ── Textarea ── */
.para-textarea {
  width: 100%;
  min-height: 140px;
  padding: 14px 16px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  font-size: 14px;
  line-height: 1.7;
  color: var(--text);
  resize: vertical;
  font-family: inherit;
  transition: border-color 0.2s;
}
.para-textarea:focus { outline: none; border-color: var(--primary-light); }
.para-textarea::placeholder { color: #b0bec5; }

/* ── Submit Row ── */
.submit-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 14px;
  gap: 12px;
}
.hint-text { font-size: 12px; color: var(--text-light); }
.btn-primary {
  padding: 11px 30px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 9px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all 0.2s;
  white-space: nowrap;
}
.btn-primary:hover:not(:disabled) { background: var(--primary-light); transform: translateY(-1px); box-shadow: 0 4px 14px rgba(41,128,185,0.25); }
.btn-primary:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

/* ── Loading ── */
.loading-dots span {
  display: inline-block;
  width: 7px; height: 7px;
  background: #fff;
  border-radius: 50%;
  margin: 0 2px;
  animation: bounce 1.2s infinite ease-in-out;
}
.loading-dots span:nth-child(2) { animation-delay: 0.2s; }
.loading-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; } 40% { transform: scale(1); opacity: 1; } }

/* ── Results Section ── */
.results-section { margin-top: 4px; }

/* ── AI Suggestion Card ── */
.ai-card {
  background: linear-gradient(135deg, #f0f7ff 0%, #e8f4fd 100%);
  border: 1.5px solid #b3d4f0;
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 16px;
}
.ai-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.ai-label {
  font-size: 12px;
  font-weight: 700;
  background: var(--primary);
  color: #fff;
  padding: 3px 10px;
  border-radius: 20px;
  letter-spacing: 0.5px;
}
.copy-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 6px 14px;
  background: #fff;
  border: 1.5px solid var(--primary-light);
  border-radius: 7px;
  font-size: 12px;
  font-weight: 600;
  color: var(--primary-light);
  cursor: pointer;
  transition: all 0.15s;
}
.copy-btn:hover { background: var(--primary-light); color: #fff; }
.copy-btn.copied { background: var(--green); border-color: var(--green); color: #fff; }
.ai-sentence {
  font-size: 14.5px;
  line-height: 1.85;
  color: #1c3a5a;
  font-weight: 500;
  margin-bottom: 14px;
}
.ai-sentence a.ref-link {
  color: var(--primary-light);
  font-weight: 700;
  text-decoration: none;
  border-bottom: 1.5px solid rgba(41,128,185,0.3);
  transition: border-color 0.15s;
}
.ai-sentence a.ref-link:hover { border-color: var(--primary-light); }
.ai-reason {
  font-size: 12.5px;
  color: #5a7a9a;
  background: rgba(255,255,255,0.7);
  border-radius: 7px;
  padding: 9px 12px;
  line-height: 1.7;
  border-left: 3px solid var(--primary-light);
}
.ai-reason strong { color: var(--primary); }

/* ── Article List ── */
.articles-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.articles-title { font-size: 15px; font-weight: 700; color: var(--text); }
.articles-count { font-size: 13px; color: var(--text-light); }
.article-item {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 18px;
  margin-bottom: 8px;
  transition: all 0.18s;
  cursor: default;
}
.article-item:hover { border-color: var(--primary-light); box-shadow: 0 3px 12px rgba(41,128,185,0.1); transform: translateY(-1px); }
.art-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary);
  line-height: 1.5;
  margin-bottom: 6px;
}
.art-title a { color: inherit; text-decoration: none; }
.art-title a:hover { color: var(--primary-light); text-decoration: underline; }
.art-meta {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  align-items: center;
  font-size: 12px;
  color: var(--text-light);
}
.art-journal { color: var(--primary-light); font-weight: 600; text-decoration: none; }
.art-journal:hover { text-decoration: underline; }
.art-tag {
  padding: 1px 9px;
  border-radius: 10px;
  font-size: 10px;
  font-weight: 700;
}
.tag-ARTICLE { background: #d4efdf; color: #1e8449; }
.tag-REVIEW { background: #d6eaf8; color: #2471a3; }
.tag-PERSPECTIVE { background: #fdebd0; color: #b9770e; }
.tag-EDITORIAL { background: #e8daef; color: #7d3c98; }
.tag-LETTER { background: #fdfefe; color: #707b7c; border: 1px solid #ccc; }
.tag-SHORT { background: #eafaf1; color: #1a8a4a; }
.art-doi { font-size: 10.5px; color: #aab; margin-left: auto; }

/* ── Search Panel ── */
.search-row {
  display: flex;
  align-items: center;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  background: #fff;
  transition: border-color 0.2s;
}
.search-row:focus-within { border-color: var(--primary-light); box-shadow: 0 0 0 3px rgba(41,128,185,0.1); }
.search-input {
  flex: 1;
  padding: 13px 16px;
  border: none;
  font-size: 15px;
  font-family: inherit;
  background: transparent;
  color: var(--text);
  min-width: 0;
}
.search-input:focus { outline: none; }
.search-input::placeholder { color: #b0bec5; }
.search-divider { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; }

/* Journal Select */
.journal-trigger {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 16px;
  height: 46px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text-light);
  background: transparent;
  border: none;
  font-family: inherit;
  white-space: nowrap;
  user-select: none;
  flex-shrink: 0;
}
.journal-trigger .arrow { font-size: 10px; transition: transform 0.2s; }
.journal-select-wrap { position: relative; }
.journal-select-wrap.open .arrow { transform: rotate(180deg); }
.journal-dropdown {
  display: none;
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  background: #fff;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.14);
  min-width: 220px;
  max-height: 320px;
  overflow-y: auto;
  z-index: 100;
}
.journal-select-wrap.open .journal-dropdown { display: block; }
.journal-opt {
  padding: 9px 14px;
  font-size: 13px;
  cursor: pointer;
  color: var(--text);
  transition: background 0.12s;
}
.journal-opt:hover { background: #f0f5fb; }
.journal-opt.selected { color: var(--primary); font-weight: 700; background: #eaf3fb; }

.search-btn {
  padding: 0 20px;
  height: 46px;
  background: var(--primary);
  color: #fff;
  border: none;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.18s;
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
.search-btn:hover:not(:disabled) { background: var(--primary-light); }
.search-btn:disabled { opacity: 0.55; cursor: not-allowed; }

/* ── Status Messages ── */
.status-msg {
  padding: 10px 16px;
  border-radius: 8px;
  font-size: 13px;
  margin-bottom: 14px;
}
.status-ok { background: var(--green-bg); color: var(--green); }
.status-warn { background: #fff8ec; color: #8a6000; }
.status-error { background: #fdedec; color: #922b21; }

/* ── No Results ── */
.no-result {
  text-align: center;
  padding: 48px 24px;
  color: var(--text-light);
}
.no-result .nr-icon { font-size: 40px; margin-bottom: 12px; }
.no-result h3 { font-size: 16px; font-weight: 700; margin-bottom: 8px; color: var(--text); }
.no-result p { font-size: 13px; line-height: 1.7; max-width: 440px; margin: 0 auto 20px; }
.no-result a.full-search-btn {
  display: inline-block;
  padding: 11px 28px;
  background: var(--accent);
  color: #fff;
  text-decoration: none;
  border-radius: 9px;
  font-size: 14px;
  font-weight: 700;
}

/* ── Citation Hint ── */
.citation-hint {
  text-align: center;
  font-size: 12px;
  color: var(--text-light);
  padding: 14px;
  border-top: 1px solid var(--border);
  margin-top: 8px;
}

/* ── API Key Status Chip ── */
.api-key-chip {
  position: fixed;
  top: 16px;
  right: 20px;
  font-size: 11px;
  padding: 4px 12px;
  border-radius: 20px;
  font-weight: 700;
  z-index: 200;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}
.api-key-chip.set { background: var(--green-bg); color: var(--green); border: 1.5px solid #a9dfbf; }
.api-key-chip.unset { background: #fff8ec; color: #b7650c; border: 1.5px solid #f0c060; }

/* ── Spinner ── */
@keyframes spin { to { transform: rotate(360deg); } }
.spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }

/* ── Footer ── */
.footer {
  background: #1a2e40;
  color: rgba(255,255,255,0.5);
  text-align: center;
  font-size: 12px;
  padding: 20px;
  line-height: 1.8;
}
.footer a { color: rgba(255,255,255,0.65); text-decoration: none; }
.footer a:hover { color: #fff; }

/* ── Responsive ── */
@media (max-width: 600px) {
  .mode-tab { font-size: 13px; padding: 10px 10px; }
  .submit-row { flex-direction: column; align-items: stretch; }
  .btn-primary { justify-content: center; }
}
</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <img src="MAP_logo.png" class="header-logo" alt="MAP" onerror="this.style.display='none'">
  <h1>MAP 文献推荐</h1>
  <p>粘贴您的段落，智能推荐 MAP 期刊文章，并生成可直接引用的学术句子</p>
</header>

<!-- Main Content -->
<main class="main">

  <!-- Mode Tabs -->
  <div class="mode-tabs">
    <button class="mode-tab active" id="tab-cite" onclick="switchTab('cite')">
      <span>✍️</span> 段落引用推荐
    </button>
    <button class="mode-tab" id="tab-search" onclick="switchTab('search')">
      <span>🔍</span> 关键词搜索
    </button>
  </div>

  <!-- Panel A: Paragraph Citation -->
  <div class="panel active" id="panel-cite">
    <div class="card">
      <div class="card-label"><span class="icon">📄</span>粘贴您正在撰写的段落</div>
      <textarea class="para-textarea" id="paraInput"
        placeholder="将您论文中的一段话粘贴于此，系统将智能匹配相关 MAP 文章，并为您生成可直接引用的学术句子（含引用原因）……"></textarea>
      <div class="submit-row">
        <span class="hint-text">支持中英文段落 · 匹配近两年 MAP 期刊文章</span>
        <button class="btn-primary" id="citeBtn" onclick="doCiteSearch()">
          <span id="citeBtnContent">智能推荐引用</span>
        </button>
      </div>
    </div>

    <div class="results-section" id="citeResults" style="display:none;">
      <!-- AI-generated sentences here -->
    </div>
  </div>

  <!-- Panel B: Keyword Search -->
  <div class="panel" id="panel-search">
    <div class="card">
      <div class="card-label"><span class="icon">🔍</span>关键词检索</div>
      <div style="position:relative;">
        <div class="search-row">
          <input type="text" class="search-input" id="searchInput"
            placeholder="搜索关键词（中英文）：salt stress·林木育种·药用植物·重金属·灌溉工程·seed germination…"
            onkeydown="if(event.key==='Enter')doKeywordSearch()">
          <div class="search-divider"></div>
          <div class="journal-select-wrap" id="journalWrap">
            <button class="journal-trigger" onclick="toggleJournalDrop(event)">
              <span id="journalText">全部期刊</span>
              <span class="arrow">▼</span>
            </button>
            <div class="journal-dropdown" id="journalDropdown"></div>
          </div>
          <button class="search-btn" id="searchBtn" onclick="doKeywordSearch()">
            <span id="searchBtnContent">检索</span>
          </button>
        </div>
      </div>
    </div>

    <div id="searchResults" style="display:none;">
      <!-- Article list here -->
    </div>
  </div>

</main>

<footer class="footer">
  &copy; 2021–2026 <a href="https://www.maxapress.com" target="_blank">Maximum Academic Press</a>.
  MAP is a member of ALPSP, COPE, CrossRef, cOAlition S, OASPA, and STM.
  <br>数据实时来源 MAP 官方 API · 由 MAP 宣传部维护
</footer>

<script>
// ============================================================
// CONFIG — Cloudflare Worker Proxy URL (handles MAP API + DeepSeek API)
// ============================================================
const DEFAULT_PROXY = 'https://map-proxy.guxiaoxiao682.workers.dev';

let CFG = {
  proxyUrl: localStorage.getItem('map_proxy_url') || DEFAULT_PROXY,
};

// ── Tab switch ──
function switchTab(tab) {
  ['cite','search'].forEach(t => {
    document.getElementById('tab-' + t).classList.toggle('active', t === tab);
    document.getElementById('panel-' + t).classList.toggle('active', t === tab);
  });
}

// ── Close dropdown on outside click ──
document.addEventListener('click', e => {
  const w = document.getElementById('journalWrap');
  if (w && !w.contains(e.target)) w.classList.remove('open');
});

// ============================================================
// MAP Journal Database
// ============================================================
const MAP_JOURNALS = [
  { id:"seedbio",   name:"Seed Biology",                   nameCN:"种子生物学",      keywords:["seed","germination","dormancy","embryo","endosperm","pollen","flowering","arabidopsis","种子","萌发","休眠","胚","花粉","开花","拟南芥","vigor","priming","stress","salt","drought","tolerance"] },
  { id:"newcontam", name:"New Contaminants",                nameCN:"新污染物",        keywords:["contaminant","pollutant","microplastic","pfas","emerging","toxic","environment","water","health","risk","pollution","污染物","微塑料","环境","健康","风险","降解","监测"] },

// Article Cache
// ============================================================
const CACHE = {};
let currentJournal = 'all';
let journalSelectLabel = '全部期刊';

// Get default year range (last 2 years, dynamic)
function getYearRange() {
  const now = new Date().getFullYear();
  return [now - 1, now];
}

// Fetch articles from MAP via proxy
async function fetchArticles(publisherId) {
  const key = publisherId;
  const now = Date.now();
  if (CACHE[key] && (now - CACHE[key].ts < 3600000)) {
    const [y0, y1] = getYearRange();
    return CACHE[key].data.filter(a => a.year >= y0 && a.year <= y1);
  }
  const proxy = CFG.proxyUrl;
  if (!proxy) return null;
  try {
    const url = proxy + '/api/articles?publisherId=' + publisherId + '&limit=200';
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    const d = await r.json();
    if (d.result === 'success' && d.data && d.data.records) {
      CACHE[key] = { data: d.data.records, ts: now };
      const [y0, y1] = getYearRange();
      return CACHE[key].data.filter(a => a.year >= y0 && a.year <= y1);
    }
    return [];
  } catch (e) {
    console.warn('fetch failed for', publisherId, e.message);
    return null;
  }
}

// Strip HTML tags
function stripHtml(s) { return (s || '').replace(/<[^>]*>/g, '').trim(); }

// Translate Chinese tokens to English
function cnToEn(token) { return CN_EN[token] || null; }

// Journal match score
function journalScore(query, j) {
  const q = query.toLowerCase();
  const tokens = q.split(/[\s,，、]+/).filter(t => t.length > 0);
  let s = 0;
  if (j.name.toLowerCase().includes(q)) s += 25;
  if (j.nameCN.includes(q)) s += 20;
  for (const t of tokens) {
    if (j.name.toLowerCase().includes(t)) s += 10;
    if (j.nameCN.includes(t)) s += 8;
    if (j.keywords.some(k => k === t || k.includes(t) || t.includes(k))) s += 4;
    const en = cnToEn(t);
    if (en) for (const e of en) {
      if (j.name.toLowerCase().includes(e)) s += 8;
      if (j.keywords.some(k => k.includes(e) || e.includes(k))) s += 4;
    }
  }
  return s;
}

// Article match score
function articleScore(title, abstract, query) {
  const q = query.toLowerCase();
  const t = (title || '').toLowerCase();
  const ab = (abstract || '').toLowerCase();
  const tokens = q.split(/[\s,，、]+/).filter(x => x.length > 0);
  let s = 0;
  if (t.includes(q)) s += 30;
  if (ab.includes(q)) s += 10;
  for (const tk of tokens) {
    if (t.includes(tk)) s += 6;
    if (ab.includes(tk)) s += 2;
    const en = cnToEn(tk);
    if (en) for (const e of en) {
      if (t.includes(e)) s += 6;
      if (ab.includes(e)) s += 3;
    }
    // sub-token decomposition
    for (const [cn, enVals] of Object.entries(CN_EN)) {
      if (cn !== tk && cn.length >= 2 && tk.includes(cn)) {
        for (const e of enVals) {
          if (t.includes(e)) s += 4;
          if (ab.includes(e)) s += 2;
        }
      }
    }
  }
  const enFull = cnToEn(q);
  if (enFull) for (const e of enFull) {
    if (t.includes(e)) s += 12;
    if (ab.includes(e)) s += 5;
  }
  return s;
}

// Find best matching articles for a query
async function findArticles(query, maxResults = 5) {
  const scored = MAP_JOURNALS.map(j => ({ j, s: journalScore(query, j) })).sort((a,b)=>b.s-a.s);
  const toSearch = scored.filter(x => x.s >= 8).slice(0, 10);
  if (toSearch.length === 0) {
    // fallback: search top journals by keywords
    toSearch.push(...scored.slice(0, 6));
  }

  const results = await Promise.all(toSearch.map(x => fetchArticles(x.j.id)));
  const all = [];
  for (let i = 0; i < results.length; i++) {
    if (!results[i]) continue;
    for (const art of results[i]) {
      const title = stripHtml(art.titleEn);
      const ab = stripHtml(art.abstractinfoEn);
      const sc = articleScore(title, ab, query);
      if (sc > 0) all.push({
        title, doi: art.doi,
        jId: toSearch[i].j.id, jName: toSearch[i].j.name,
        year: art.year, volume: art.volume, issue: art.issue,
        type: art.classifyinfoEn || 'ARTICLE', score: sc
      });
    }
  }
  all.sort((a,b) => b.score - a.score);
  return all.slice(0, maxResults);
}

async function doKeywordSearch() {
  if (!CFG.proxyUrl) { alert('代理服务未配置'); return; }
  const q = document.getElementById('searchInput').value.trim();
  if (!q) return;

  const btn = document.getElementById('searchBtn');
  const bc  = document.getElementById('searchBtnContent');
  btn.disabled = true;
  bc.innerHTML = '<div class="spinner"></div>';

  const resultsDiv = document.getElementById('searchResults');
  resultsDiv.style.display = 'block';
  resultsDiv.innerHTML = '<div class="card" style="text-align:center;padding:28px;color:var(--text-light);font-size:14px;">正在检索中，请稍候…</div>';

  try {
    let articles = [];
    if (currentJournal !== 'all') {
      // Specific journal: fetch + filter
      const arts = await fetchArticles(currentJournal);
      if (arts) {
        for (const art of arts) {
          const title = stripHtml(art.titleEn);
          const ab = stripHtml(art.abstractinfoEn);
          const sc = articleScore(title, ab, q);
          if (sc > 0) articles.push({ title, doi: art.doi, jId: currentJournal, jName: journalSelectLabel, year: art.year, volume: art.volume, issue: art.issue, type: art.classifyinfoEn || 'ARTICLE', score: sc });
        }
      }
    } else {
      articles = await findArticles(q, 40);
    }
    articles.sort((a,b) => b.score - a.score);

    if (articles.length === 0) {
      resultsDiv.innerHTML = renderNoResult(q);
    } else {
      resultsDiv.innerHTML = renderArticleList(articles, q);
    }
  } catch(err) {
    resultsDiv.innerHTML = '<div class="card"><div class="status-msg status-error">检索出错：' + err.message + '</div></div>';
  }
  btn.disabled = false;
  bc.textContent = '检索';
}

// PARAGRAPH CITATION (AI)
// ============================================================
async function doCiteSearch() {
  const para = document.getElementById('paraInput').value.trim();
  if (!para) { alert('请先粘贴您的段落内容'); return; }
  if (!CFG.proxyUrl) { alert('代理服务未配置，请联系管理员'); return; }

  const btn = document.getElementById('citeBtn');
  const bc  = document.getElementById('citeBtnContent');
  btn.disabled = true;
  bc.innerHTML = '<div class="loading-dots"><span></span><span></span><span></span></div>';

  const resultsDiv = document.getElementById('citeResults');
  resultsDiv.style.display = 'block';
  resultsDiv.innerHTML = '<div class="card" style="text-align:center;padding:28px;color:var(--text-light);font-size:14px;">AI 正在分析段落并检索相关文章…</div>';

  try {
    // Step 1: Ask AI to extract key topics from the paragraph
    const extractPrompt = `You are a research assistant. Read the following paragraph and extract 2-3 concise English search queries (each 2-4 words) that capture the core scientific topics discussed. Return ONLY a JSON array of strings, no explanation.

Paragraph:
"""
${para}
"""

Return format example: ["salt stress tolerance", "root development arabidopsis"]`;

    const extractResp = await callDeepSeek(extractPrompt, 200);
    let queries = [];
    try {
      const match = extractResp.match(/\[[\s\S]*?\]/);
      queries = match ? JSON.parse(match[0]) : [para.slice(0, 80)];
    } catch {
      queries = [para.slice(0, 80)];
    }

    // Step 2: Fetch matching articles for each query
    let candidateArticles = [];
    for (const q of queries.slice(0, 3)) {
      const arts = await findArticles(q, 8);
      for (const a of arts) {
        if (!candidateArticles.find(x => x.doi === a.doi)) candidateArticles.push(a);
      }
    }
    candidateArticles.sort((a,b) => b.score - a.score);
    const topArts = candidateArticles.slice(0, 5);

    if (topArts.length === 0) {
      resultsDiv.innerHTML = renderNoResult('the given paragraph');
      btn.disabled = false;
      bc.textContent = '智能推荐引用';
      return;
    }

    // Step 3: Ask AI to generate citation sentences
    const artList = topArts.map((a,i) =>
      `[${i+1}] ${a.title}. ${a.jName} (${a.year}). DOI: ${a.doi}`
    ).join('\n');

    const citationPrompt = `You are an academic writing assistant helping a researcher add citations to their paper. 

The researcher's paragraph (in Chinese or English):
"""
${para}
"""

Here are relevant MAP journal articles (published in last 2 years) that can be cited:
${artList}

Task: Write 2 citation sentences in the SAME language as the paragraph that can be naturally inserted after the paragraph to broaden its scope or deepen discussion. Each sentence should:
- Cite 1-2 of the articles above using "[n]" notation
- Be academically fluent and specific (not generic)
- Add real scientific value (a different angle, methodology, or finding)

Also provide a 1-sentence reason for each citation (why it adds value, e.g., "拓展了讨论广度" / "补充了分子机制视角" / "提供了近期实验支撑").

Return ONLY a JSON array (no markdown), like:
[
  {
    "sentence": "...[1].",
    "reason": "...",
    "cited": [1]
  },
  {
    "sentence": "...[2].",
    "reason": "...",
    "cited": [2]
  }
]`;

    const citationResp = await callDeepSeek(citationPrompt, 800);
    let suggestions = [];
    try {
      const match = citationResp.match(/\[[\s\S]*\]/);
      suggestions = match ? JSON.parse(match[0]) : [];
    } catch {
      suggestions = [];
    }

    // Render
    resultsDiv.innerHTML = renderCiteResults(suggestions, topArts);

  } catch(err) {
    resultsDiv.innerHTML = '<div class="card"><div class="status-msg status-error">出错：' + err.message + '</div></div>';
  }
  btn.disabled = false;
  bc.textContent = '智能推荐引用';
}

// ── Call DeepSeek API (via Cloudflare Worker proxy) ──
async function callDeepSeek(prompt, maxTokens = 500) {
  const resp = await fetch(CFG.proxyUrl + '/api/deepseek', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'deepseek-chat',
      messages: [{ role: 'user', content: prompt }],
      max_tokens: maxTokens,
      temperature: 0.3,
    }),
  });
  if (!resp.ok) {
    const e = await resp.text();
    throw new Error('DeepSeek API error: ' + resp.status + ' ' + e.slice(0, 200));
  }
  const d = await resp.json();
  return d.choices[0].message.content;
}

// ============================================================
// RENDER HELPERS
// ============================================================
const TYPE_LABEL = { ARTICLE:'研究论文', REVIEW:'综述', 'MINI REVIEW':'综述', PERSPECTIVE:'观点', EDITORIAL:'编委评论', 'SHORT COMMUNICATION':'简报', LETTER:'通讯' };
const TYPE_CSS   = { ARTICLE:'tag-ARTICLE', REVIEW:'tag-REVIEW', 'MINI REVIEW':'tag-REVIEW', PERSPECTIVE:'tag-PERSPECTIVE', EDITORIAL:'tag-EDITORIAL', LETTER:'tag-LETTER', 'SHORT COMMUNICATION':'tag-SHORT' };

function renderArticleItem(a) {
  const url = 'https://www.maxapress.com/' + a.jId + '/article/' + a.doi;
  const jUrl = 'https://www.maxapress.com/' + a.jId;
  const tl = TYPE_LABEL[a.type] || a.type || '研究论文';
  const tc = TYPE_CSS[a.type] || 'tag-ARTICLE';
  return `<div class="article-item">
    <div class="art-title"><a href="${url}" target="_blank">${a.title}</a></div>
    <div class="art-meta">
      <a href="${jUrl}" class="art-journal" target="_blank">${a.jName}</a>
      <span>${a.year}${a.volume ? ' · Vol.'+a.volume : ''}${a.issue ? '('+a.issue+')' : ''}</span>
      <span class="art-tag ${tc}">${tl}</span>
      <span class="art-doi">DOI: ${a.doi}</span>
    </div>
  </div>`;
}

function renderArticleList(articles, query) {
  const [y0, y1] = getYearRange();
  return `<div class="card">
    <div class="articles-header">
      <div class="articles-title">检索结果</div>
      <div class="articles-count">${articles.length} 篇匹配文章 · ${y0}–${y1} 年</div>
    </div>
    ${articles.map(renderArticleItem).join('')}
    <div class="citation-hint">📝 点击标题查看全文与引用格式，DOI 已标注</div>
  </div>`;
}

function renderCiteResults(suggestions, articles) {
  const [y0, y1] = getYearRange();
  let html = '';

  if (suggestions.length > 0) {
    // AI sentence cards
    html += `<div class="card">
      <div class="card-label"><span class="icon">✨</span>推荐引用句子</div>`;

    for (const sug of suggestions) {
      // Build sentence with linked citations
      let sentence = sug.sentence || '';
      // Replace [n] with actual DOI links
      sentence = sentence.replace(/\[(\d+)\]/g, (m, n) => {
        const idx = parseInt(n) - 1;
        const art = articles[idx];
        if (!art) return m;
        const url = 'https://www.maxapress.com/' + art.jId + '/article/' + art.doi;
        return `<a class="ref-link" href="${url}" target="_blank" title="${art.title}">[${n}]</a>`;
      });

      const plainText = sug.sentence || '';
      html += `<div class="ai-card">
        <div class="ai-card-header">
          <span class="ai-label">AI 推荐句</span>
          <button class="copy-btn" onclick="copyText(this, ${JSON.stringify(plainText)})">
            📋 复制
          </button>
        </div>
        <div class="ai-sentence">${sentence}</div>
        <div class="ai-reason"><strong>引用原因：</strong>${sug.reason || ''}</div>
      </div>`;
    }
    html += `</div>`;
  }

  // Referenced articles
  html += `<div class="card">
    <div class="articles-header">
      <div class="articles-title">推荐文章</div>
      <div class="articles-count">${articles.length} 篇匹配 · ${y0}–${y1} 年</div>
    </div>
    ${articles.map(renderArticleItem).join('')}
    <div class="citation-hint">📝 以上文章均已在 MAP 期刊正式发表，可直接引用。点击标题查看全文。</div>
  </div>`;

  return html;
}

function renderNoResult(q) {
  return `<div class="card">
    <div class="no-result">
      <div class="nr-icon">📚</div>
      <h3>未找到匹配文章</h3>
      <p>在近两年 MAP 期刊文章中未能匹配到相关结果。可尝试使用英文关键词，或前往 MAP 全平台搜索。</p>
      <a class="full-search-btn" href="https://www.maxapress.com/search" target="_blank">前往 MAP 全平台检索 →</a>
    </div>
  </div>`;
}

// ── Copy to clipboard ──
function copyText(btn, text) {
  navigator.clipboard.writeText(text).then(() => {
    btn.classList.add('copied');
    btn.textContent = '✓ 已复制';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.textContent = '📋 复制';
    }, 2000);
  }).catch(() => {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    btn.classList.add('copied');
    btn.textContent = '✓ 已复制';
    setTimeout(() => { btn.classList.remove('copied'); btn.textContent = '📋 复制'; }, 2000);
  });
}
